[package]
name = "tg-archive-bot"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Bot for archiving messages in TeenGovernment and related servers"
authors = ["Elias Wendland <eliaswendland@pm.me>"]
readme = "README.md"
repository = "https://git.ewenlau.net/ewenlau/tg-archive-bot"
homepage = "https://git.ewenlau.net/ewenlau/tg-archive-bot"

[dependencies]
askama = "=0.16.0"
axum = { version = "=0.8.9", features = ["form"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
dotenv = "=0.15.0"
ipnet = "=2.12.1"
poise = "=0.6.2"
pulldown-cmark = "=0.13.4"
rand = "=0.10.2"
reqwest = { version = "=0.13.4", features = ["json", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", features = ["postgres", "runtime-tokio", "macros"] }
tokio = { version = "=1.53.1", features = ["full"] }
tower-sessions = "=0.14.0"
tower-sessions-redis-store = "=0.16.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
urlencoding = "=2.1.3"
