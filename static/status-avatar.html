<li>{% if !image_checked %}
    <a href="{{avatar_url}}"><img src="{{avatar_url}}" crossorigin="anonymous" alt="Archived user avatar" width="64" height="64"></a>
    {% else if image_available %}
    <a href="{{image_url}}"><img src="{{image_url}}" alt="Archived user avatar" width="64" height="64"></a>
    {% else %}
    <span class="unavailable">unavailable</span>
    {% endif %}- first seen {{first_seen}}, last seen {{last_seen}}</li>
