services:
  postgres:
    image: postgres:16-alpine
    container_name: tg-archive-bot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${TG_BOT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${TG_BOT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${TG_BOT_POSTGRES_DB:-tg_archive_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-tg_archive_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8-alpine
    container_name: tg-archive-bot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
