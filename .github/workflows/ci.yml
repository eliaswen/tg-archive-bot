name: CI and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/tg_archive_bot
  DISCORD_TOKEN: testing

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tg_archive_bot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev

      - name: Set up Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --silent --show-error --fail \
              https://sh.rustup.rs --output /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  runtime:
    name: Smoke test ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu-runtime
            scope: cpu
          - target: cuda-runtime
            scope: ml
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tg_archive_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.target == 'cuda-runtime'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          load: true
          tags: tg-archive-bot-smoke:latest

      - name: Start web process
        run: |
          docker run -d --name smoke --network host \
            --env TG_BOT_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/tg_archive_bot \
            --env TG_BOT_REDIS_URL=redis://127.0.0.1:6379 \
            --env TG_BOT_WEB_ADDRESS=127.0.0.1:3000 \
            --env TG_BOT_DISCORD_TOKEN=smoke-do-not-use \
            --env TG_BOT_DISCORD_CLIENT_ID=smoke-do-not-use \
            --env TG_BOT_DISCORD_CLIENT_SECRET=smoke-do-not-use \
            --env TG_BOT_DISCORD_REDIRECT_URI=http://127.0.0.1:3000/login/discord/callback \
            --env TG_BOT_LOG=info \
            tg-archive-bot-smoke:latest web

      - name: Wait for readiness and check ONNX Runtime
        run: |
          for attempt in $(seq 1 120); do
            if [[ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]]; then
              echo "Container exited during startup"
              docker logs smoke
              exit 1
            fi
            if curl --silent --fail http://127.0.0.1:3000/api/v1/healthcheck >/dev/null; then
              docker logs smoke > smoke.log 2>&1
              cat smoke.log
              if grep -E "panicked|semantic search unavailable" smoke.log; then
                echo "ONNX Runtime failed to load the text encoder"
                exit 1
              fi
              exit 0
            fi
            sleep 5
          done

          echo "Application did not become ready"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

  release_metadata:
    name: Detect release commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release_commit.outputs.is_release }}
      is_prerelease: ${{ steps.release_commit.outputs.is_prerelease }}
      version: ${{ steps.release_commit.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect release commit
        id: release_commit
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          echo "is_release=false" >> "$GITHUB_OUTPUT"

          if [[ "$subject" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            if [[ "${BASH_REMATCH[1]%%.*}" -eq 0 ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  container:
    name: Build and publish container
    needs: [release_metadata, runtime]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=${{ needs.release_metadata.outputs.version }},enable=${{ needs.release_metadata.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.release_metadata.outputs.is_release == 'true' }}

      - name: Extract ML Docker metadata
        id: meta_ml
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-ml
          tags: |
            type=raw,value=dev
            type=raw,value=${{ needs.release_metadata.outputs.version }},enable=${{ needs.release_metadata.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.release_metadata.outputs.is_release == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cpu-runtime
          cache-from: type=gha,scope=cpu
          cache-to: type=gha,mode=max,scope=cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push ML
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cuda-runtime
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
          push: true
          tags: ${{ steps.meta_ml.outputs.tags }}
          labels: ${{ steps.meta_ml.outputs.labels }}

  release:
    name: Create release
    needs: [release_metadata, container]
    if: success() && needs.release_metadata.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate linked release notes
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          previous_tag="$(
            git tag --merged HEAD^ --sort=-version:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 || true
          )"

          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..HEAD"
            heading="## Commits since ${previous_tag}"
          else
            range="HEAD"
            heading="## Commits"
          fi

          echo "$heading" > release-notes.md
          echo >> release-notes.md
          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"
            printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
              "$short_sha" "$SERVER_URL" "$REPOSITORY" "$sha" "$subject"
          done < <(git log --reverse --pretty=tformat:'%H%x09%s' "$range") \
            >> release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release_metadata.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; nothing to do."
            exit 0
          fi

          prerelease=()
          if [[ "${{ needs.release_metadata.outputs.is_prerelease }}" == "true" ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
